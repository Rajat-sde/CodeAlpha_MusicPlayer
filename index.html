<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- SEO & Browser Meta -->
        <title>LuxeSound | Modern Glassmorphism Music Player</title>
        <meta name="description"
            content="A sleek, responsive, glassmorphic web music player built with HTML, CSS, and Vanilla JavaScript.">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <!-- Hidden Audio Element -->
        <audio id="audioPlayer"></audio>

        <!-- Main Music Player Container -->
        <main class="player-card">

            <!-- Top Bar -->
            <header class="player-header">
                <span class="brand">LuxeSound</span>
                <span class="status-dot" title="Now Playing"></span>
            </header>

            <!-- Album Art / Thumbnail -->
            <section class="cover-container">
                <img id="coverArt"
                    src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=400&q=80"
                    alt="Album Cover" class="cover-art">
            </section>

            <!-- Track Details -->
            <section class="track-info">
                <h2 id="songTitle" class="song-title">Select a Song</h2>
                <p id="songArtist" class="song-artist">Artist Name</p>
            </section>

            <!-- Timeline & Progress Bar -->
            <section class="progress-container">
                <input type="range" id="progressBar" min="0" max="100" value="0"
                    class="slider" aria-label="Track Progress">
                <div class="time-stamps">
                    <span id="currentTime">0:00</span>
                    <span id="totalDuration">0:00</span>
                </div>
            </section>

            <!-- Playback Controls -->
            <section class="controls">
                <button id="prevBtn" class="btn btn-icon"
                    aria-label="Previous Track">⏮</button>
                <button id="playPauseBtn" class="btn btn-icon btn-play"
                    aria-label="Play or Pause">▶</button>
                <button id="nextBtn" class="btn btn-icon"
                    aria-label="Next Track">⏭</button>
            </section>

            <!-- Volume Bar -->
            <section class="volume-container">
                <span class="volume-icon">🔊</span>
                <input type="range" id="volumeSlider" min="0" max="1"
                    step="0.01" value="0.8" class="slider"
                    aria-label="Volume Slider">
            </section>

            <!-- Playlist Section (Bonus Feature) -->
            <section class="playlist-section">
                <h3 class="playlist-title">Playlist</h3>
                <ul id="playlist" class="playlist-list">
                    <!-- Dynamically populated by JS -->
                </ul>
            </section>

        </main>

        <script src="script.js"></script>
    </body>
</html>
